# Lançar uma versão nova:
#   1. mude __version__ em artemis/__init__.py (ex.: 0.2.0) e faça commit
#   2. git tag v0.2.0 && git push --tags
# O GitHub compila o instalador e publica a Release; os apps instalados se atualizam sozinhos.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Conferir versão x tag
        shell: pwsh
        run: |
          $v = (python -c "import artemis; print(artemis.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} difere da versão $v" }
      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: ./build.ps1 -DownloadBaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist\4rt3mi5-Setup-*.exe).FullName dist\latest.json `
            --title "${{ github.ref_name }}" --generate-notes
