# Lançar uma versão nova:
#   1. mude __version__ em artemis/__init__.py (ex.: 0.23.0) e faça commit
#   2. git tag v0.23.0 && git push --tags
# 0.23.0: o app para Windows foi descontinuado. A tag só confere a versão (segredos, testes, versão x tag) e publica a
# Release com as notas; nenhum instalador é compilado. O site é atualizado no servidor (docker compose).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Barreira de dados sensíveis (bloqueia a versão se achar segredo)
        run: python tools/check_secrets.py --all
      - run: pip install -r requirements-dev.txt
      - name: Testes
        run: python -m unittest discover -s tests -t .
      - name: Conferir versão x tag
        run: |
          v=$(python -c "import artemis; print(artemis.__version__)")
          if [ "v$v" != "${{ github.ref_name }}" ]; then echo "Tag ${{ github.ref_name }} difere da versão $v"; exit 1; fi
      - name: Publicar Release (só as notas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
