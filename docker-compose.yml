# Só o servidor (rede local):   docker compose up -d --build
# Com acesso pela internet:     docker compose --profile public up -d --build   (precisa do arquivo .env)
# Códigos:   docker compose exec server python -m artemis.server keys create --label "Nome"
#            docker compose exec server python -m artemis.server keys list
# Logs:      docker compose logs -f
# Limite dos logs de cada container (evita arquivos grandes demais na VM da Oracle)
x-logs: &logs
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  server:
    logging: *logs
    build: .
    image: artemis-server
    container_name: artemis-server
    restart: unless-stopped
    environment:
      TZ: "<-03>3"     # horário de Brasília (sem precisar instalar tzdata na imagem)
      # 0.21.0: tela de contato. Sem usuário/senha SMTP, as mensagens ficam só no painel admin.
      ARTEMIS_CONTACT_EMAIL: ${ARTEMIS_CONTACT_EMAIL:-contato@artemishunt.com.br}
      ARTEMIS_CONTACT_INBOX: ${ARTEMIS_CONTACT_INBOX:-}
      ARTEMIS_SMTP_USER: ${ARTEMIS_SMTP_USER:-}
      ARTEMIS_SMTP_PASSWORD: ${ARTEMIS_SMTP_PASSWORD:-}
      # 0.22.2: tradução automática das notícias/calendário do Tibia (DeepL; sem chave fica em inglês)
      ARTEMIS_DEEPL_KEY: ${ARTEMIS_DEEPL_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"   # só este PC (o acesso de fora é pelo ngrok)
    volumes:
      - ./data:/data   # banco SQLite (data/artemis.db) fica na pasta do projeto

  # Túnel ngrok: publica o servidor no seu domínio fixo grátis (ex.: https://nome.ngrok-free.app).
  # Token e domínio ficam no arquivo .env (copie de .env.example) - o .env nunca vai para o GitHub.
  ngrok:
    image: ngrok/ngrok:3
    container_name: artemis-ngrok
    logging: *logs
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Preencha NGROK_AUTHTOKEN no arquivo .env}
    command: ["http", "server:8000", "--url=${NGROK_DOMAIN:?Preencha NGROK_DOMAIN no arquivo .env}"]
    ports:
      - "127.0.0.1:4040:4040"   # painel do ngrok (mostra as requisições inteiras): só neste PC

  # Domínio próprio com HTTPS automático (ex.: DuckDNS grátis), sem a página de aviso do ngrok.
  # Liga com --profile dominio (os scripts da pasta deploy/ fazem isso sozinhos quando SITE_DOMAIN está no .env).
  # Precisa das portas 80 e 443 abertas na VM (deploy/GUIA-VM.md). O ngrok continua funcionando junto.
  caddy:
    image: caddy:2
    container_name: artemis-caddy
    logging: *logs
    profiles: ["dominio"]
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}   # vazio fora do perfil "dominio" (assim o resto do arquivo não exige)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados do HTTPS (não precisa de backup: o Caddy pede de novo)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
