<!doctype html>
<!-- Arte de fundo do launcher do 4rt3mi5: Ártemis no Olimpo, sob a lua cheia.
     Gerada em PNG por launcher\build-launcher.ps1 (Edge sem janela, escala 2x). Tamanho lógico 860x520. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Cinzel+Decorative:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #05060d; overflow: hidden; }
  svg { display: block; width: 860px; height: 520px; }
  .logo { font-family: "Cinzel Decorative", "Cinzel", serif; font-weight: 700; }
  .sub { font-family: "Cinzel", serif; font-weight: 700; }
</style></head>
<body>
<svg id="cena" viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050c"/>
      <stop offset=".35" stop-color="#0a0e26"/>
      <stop offset=".62" stop-color="#1b1a3d"/>
      <stop offset=".78" stop-color="#3a2b4f"/>
      <stop offset="1" stop-color="#5a3c4a"/>
    </linearGradient>
    <radialGradient id="lua" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset=".55" stop-color="#f8ecc9"/>
      <stop offset=".88" stop-color="#ebd294"/>
      <stop offset="1" stop-color="#d9b866"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#f2c94c" stop-opacity=".16"/>

    <radialGradient id="templo-luz" cx=".5" cy=".5" r=".5">

      <stop offset="1" stop-color="#f2a93c" stop-opacity="0"/>

    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">

    </linearGradient>
    <linearGradient id="monte-meio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1e3c"/>
      <stop offset="1" stop-color="#0e0f22"/>
    </linearGradient>
    <linearGradient id="neve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3ecdc" stop-opacity=".95"/>
      <stop offset="1" stop-color="#9c9cc4" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="nevoa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b8e8" stop-opacity="0"/>
      <stop offset=".3" stop-color="#d8c8f0" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#d8c8f0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c9b8e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060d" stop-opacity="0"/>
      <stop offset=".55" stop-color="#05060d" stop-opacity=".7"/>
      <stop offset="1" stop-color="#05060d" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="direita" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05060d" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060d" stop-opacity=".55"/>
    </linearGradient>
    <filter id="borra" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="borra2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="logo-brilho" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feFlood flood-color="#f2c94c" flood-opacity=".45"/><feComposite in2="b" operator="in" result="g"/>
      <feOffset in="SourceAlpha" dy="2" result="o"/><feGaussianBlur in="o" stdDeviation="1.5" result="ob"/>
      <feFlood flood-color="#000" flood-opacity=".8"/><feComposite in2="ob" operator="in" result="s"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disco"><circle cx="268" cy="208" r="126"/></clipPath>
  </defs>

  <!-- céu -->
  <rect width="860" height="520" fill="url(#ceu)"/>
  <g id="estrelas"></g>

  <!-- Órion, o caçador companheiro de Ártemis -->

    <polyline points="470,92 462,132"/><polyline points="482,100 498,134"/>
    <polyline points="452,58 500,64"/>
  </g>
  <g fill="#fff8e6">

    <circle cx="520" cy="40" r="1.3"/><circle cx="470" cy="92" r="1.5"/><circle cx="476" cy="96" r="1.5"/>
    <circle cx="482" cy="100" r="1.5"/><circle cx="462" cy="132" r="2.1"/><circle cx="498" cy="134" r="1.6"/>
  </g>
  </g>

  <!-- lua cheia -->
  <circle cx="268" cy="208" r="250" fill="url(#halo)"/>
  <circle cx="268" cy="208" r="132" fill="#fff3cf" opacity=".35" filter="url(#borra)"/>
  <circle cx="268" cy="208" r="126" fill="url(#lua)"/>

  <ellipse cx="330" cy="296" rx="150" ry="5" fill="#efe4ff" opacity=".1" filter="url(#borra)"/>

  <!-- neve do Olimpo, iluminada pela lua (face esquerda) -->
  <path fill="url(#neve)" d="M420,230 L446,212 L462,206 L470,212 L456,222 L448,240 L436,236 L424,252 L410,250 Z"/>
  <path fill="url(#neve)" opacity=".7" d="M340,300 L382,262 L392,258 L384,276 L366,284 L354,300 Z"/>
  <path fill="url(#neve)" opacity=".55" d="M118,302 L150,318 L138,318 L128,312 L112,316 Z"/>
  <!-- nuvens no pé do Olimpo -->
  <ellipse cx="470" cy="300" rx="190" ry="14" fill="#cbbbe6" opacity=".14" filter="url(#borra)"/>
  <ellipse cx="700" cy="318" rx="170" ry="12" fill="#cbbbe6" opacity=".12" filter="url(#borra)"/>

  <!-- montanhas do meio -->
  <path fill="url(#monte-meio)" d="M0,392 L52,370 L96,384 L140,360 L196,376 L236,364 L300,386 L350,372 L404,392 L452,370
    L510,384 L566,356 L612,368 L650,350 L700,372 L742,360 L790,376 L860,362 L860,520 L0,520 Z"/>
  <!-- luz da lua nas cristas -->
  <path fill="none" stroke="#b6a7e0" stroke-opacity=".25" stroke-width="1" d="M0,392 L52,370 L96,384 L140,360 L196,376 L236,364"/>

  <!-- templo de Ártemis no penhasco, com tochas acesas -->
  <circle cx="752" cy="388" r="78" fill="url(#templo-luz)"/>
  <path fill="#0c0d1d" d="M640,520 L660,420 L700,404 L812,404 L846,424 L860,520 Z"/>
  <g transform="translate(704,354)">
    <rect x="-4" y="46" width="104" height="5" fill="#2a2440"/>
    <rect x="0" y="42" width="96" height="5" fill="#3a3152"/>
    <rect x="4" y="38" width="88" height="5" fill="#4a3f63"/>
    <!-- luz dourada entre as colunas -->
    <rect x="8" y="12" width="80" height="26" fill="#ffcf6a" opacity=".85"/>
    <rect x="8" y="12" width="80" height="26" fill="#ff9d2e" opacity=".35" filter="url(#borra2)"/>
    <g fill="#1a1630">
      <rect x="6" y="12" width="7" height="26"/><rect x="21" y="12" width="7" height="26"/>
      <rect x="36" y="12" width="7" height="26"/><rect x="51" y="12" width="7" height="26"/>
      <rect x="66" y="12" width="7" height="26"/><rect x="81" y="12" width="7" height="26"/>
    </g>
    <rect x="2" y="7" width="92" height="6" fill="#2b2542"/>
    <path d="M0,8 L48,-10 L96,8 Z" fill="#231e38"/>
    <path d="M14,6 L48,-5 L82,6 Z" fill="#3a3152"/>
    <circle cx="48" cy="1" r="2.2" fill="#f2c94c" filter="url(#brilho)"/>
  </g>
  <!-- tochas -->
  <g filter="url(#brilho)">
    <circle cx="694" cy="392" r="2.6" fill="#ffd36b"/><circle cx="812" cy="392" r="2.6" fill="#ffd36b"/>
  </g>
  <g fill="#0c0d1d"><rect x="693" y="393" width="2" height="12"/><rect x="811" y="393" width="2" height="12"/></g>

  <!-- rochedo de Ártemis, na frente da lua -->
  <path fill="#07080f" d="M0,520 L0,430 L60,408 L118,402 L168,380 L214,366 L246,356 L262,350 L282,352 L300,362 L330,382
    L372,398 L420,420 L468,446 L520,476 L560,520 Z"/>
  <path fill="none" stroke="#e9d9a8" stroke-opacity=".35" stroke-width="1.2" d="M168,380 L214,366 L246,356 L262,350 L282,352"/>

  <!-- Ártemis: arco tenso, flecha de ouro apontada para o alto -->
  <g transform="translate(264,351) scale(1.08)" fill="#07080f" stroke="#07080f" stroke-linecap="round" stroke-linejoin="round">
    <!-- rabo de cavalo ao vento -->
    <path stroke="none" d="M-2,-148 C-16,-153 -28,-147 -40,-141 C-48,-137 -56,-139 -63,-144 C-57,-131 -43,-128 -30,-132
      C-18,-136 -10,-135 -2,-135 Z"/>
    <!-- aljava nas costas -->
    <g transform="rotate(-24 -8 -110)">
      <rect stroke="none" x="-14" y="-134" width="10" height="42" rx="3"/>
      <path stroke-width="1.5" fill="none" d="M-12,-134 L-15,-146 M-9,-134 L-9,-148 M-6,-134 L-3,-146"/>
    </g>
    <!-- pernas (a túnica cobre até a canela) -->
    <path stroke-width="6" fill="none" d="M0,-36 L-14,-1"/>
    <path stroke-width="6" fill="none" d="M12,-36 L25,-2"/>
    <path stroke="none" d="M-20,1 L-10,-3 L-8,1 Z"/><path stroke="none" d="M22,-1 L33,-3 L31,1 Z"/>
    <!-- túnica (quíton) com a barra ao vento -->
    <path stroke="none" d="M-3,-122 L13,-122 C18,-116 18,-106 14,-98 L14,-94 C18,-74 24,-52 28,-30 C16,-26 4,-30 -6,-28
      C-18,-30 -30,-28 -44,-32 C-52,-34 -58,-40 -63,-47 C-51,-42 -42,-44 -34,-50 C-24,-66 -12,-82 -6,-94 L-6,-98
      C-8,-108 -6,-116 -3,-122 Z"/>
    <!-- cinto dourado -->
    <path fill="none" stroke="#d6ad4f" stroke-width="1.5" d="M-6,-95 C2,-93 8,-94 15,-96"/>
    <!-- pescoço, cabeça e coque -->
    <path stroke-width="5.5" fill="none" d="M5,-122 L7,-129"/>
    <circle stroke="none" cx="9" cy="-138" r="8.5"/>
    <circle stroke="none" cx="-1" cy="-143" r="6"/>
    <path stroke="none" d="M16,-140 L20.5,-136.5 L16,-134.5 Z"/>
    <!-- diadema de lua crescente -->
    <path fill="#f2c94c" stroke="none" d="M1,-150 C5,-157 14,-157 18,-150 C14,-153.5 5,-153.5 1,-150 Z" filter="url(#brilho)"/>
    <!-- braço do arco, esticado -->
    <path stroke-width="5" fill="none" d="M12,-120 L40,-129 L66,-138"/>
    <!-- braço que puxa a corda -->
    <path stroke-width="5" fill="none" d="M2,-120 L-22,-126 L12,-132"/>
    <!-- arco -->
    <path fill="none" stroke-width="3.2" d="M50,-190 C88,-170 92,-112 80,-88"/>
    <path fill="none" stroke-width="1.6" d="M50,-190 C46,-196 42,-198 38,-198"/>
    <path fill="none" stroke-width="1.6" d="M80,-88 C82,-82 82,-78 80,-74"/>
    <!-- corda -->
    <path fill="none" stroke="#3a3550" stroke-width=".9" d="M50,-190 L12,-132 L80,-88"/>
  </g>
  <!-- flecha de ouro -->
  <g transform="translate(264,351) scale(1.08)" filter="url(#brilho)">
    <path stroke="#ffe9a0" stroke-width="2" stroke-linecap="round" d="M12,-132 L104,-161"/>
    <path fill="#fff4cc" d="M112,-164 L100,-166 L103,-159 Z"/>
    <path fill="#f2c94c" d="M12,-132 L4,-138 L8,-131 Z M12,-132 L3,-129 L8,-127 Z"/>
  </g>
  <!-- rastro de luz da flecha -->
  <path d="M380,190 L560,140" stroke="#f2c94c" stroke-opacity=".0" stroke-width="1"/>

  <!-- partículas douradas -->
  <g id="faiscas"></g>

  <!-- leitura do texto e dos botões -->
  <rect y="360" width="860" height="160" fill="url(#chao)"/>
  <rect x="430" width="430" height="520" fill="url(#direita)"/>

  <!-- marca -->
  <g filter="url(#logo-brilho)">
    <text x="640" y="112" text-anchor="middle" class="logo" font-size="58" letter-spacing="3" fill="url(#ouro)">4rt3mi5</text>
  </g>
  <g transform="translate(640,138)">
    <line x1="-118" y1="0" x2="-20" y2="0" stroke="#f2c94c" stroke-opacity=".55" stroke-width="1"/>
    <line x1="20" y1="0" x2="118" y2="0" stroke="#f2c94c" stroke-opacity=".55" stroke-width="1"/>
    <!-- o símbolo do app: lua e flecha -->
    <circle r="8" fill="none" stroke="#f2c94c" stroke-width="1.6"/>
    <path d="M-7,7 L8,-8 M8,-8 L3,-8 M8,-8 L8,-3" stroke="#f2c94c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
  <text x="640" y="166" text-anchor="middle" class="sub" font-size="11.5" letter-spacing="5.5" fill="#e8d9a6" fill-opacity=".85">COMPANHEIRO DE HUNT</text>
</svg>
<script>
  // aleatório com semente: a arte sai igual toda vez
  let s = 20261115;
  const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const NS = "http://www.w3.org/2000/svg";
  const est = document.getElementById("estrelas");
  for (let i = 0; i < 230; i++) {
    const x = r() * 860, y = r() * 330;
    const dx = x - 268, dy = y - 208;
    if (dx * dx + dy * dy < 150 * 150) continue;           // nada de estrela na frente da lua
    const c = document.createElementNS(NS, "circle");
    const big = r() < .08;
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("r", (big ? 1.1 + r() * .8 : .35 + r() * .6).toFixed(2));
    c.setAttribute("fill", r() < .2 ? "#ffe6b0" : "#e6ebff");
    c.setAttribute("opacity", ((1 - y / 380) * (.35 + r() * .65)).toFixed(2));
    if (big) c.setAttribute("filter", "url(#brilho)");
    est.appendChild(c);
  }
  const fa = document.getElementById("faiscas");
  for (let i = 0; i < 38; i++) {
    const x = 120 + r() * 700, y = 200 + r() * 290;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("r", (.5 + r() * 1.3).toFixed(2));
    c.setAttribute("fill", "#ffd77a"); c.setAttribute("opacity", (.25 + r() * .6).toFixed(2));
    c.setAttribute("filter", "url(#brilho)");
    fa.appendChild(c);
  }
</script>
</body></html>
