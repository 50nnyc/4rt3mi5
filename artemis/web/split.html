<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="robots" content="noindex">
<!-- 0.29.0: página do link público de um lootsplit. Só lê do próprio servidor; nenhum script embutido. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<!--OG-->
<title>4rt3mi5 · Lootsplit</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&display=swap">
<style>
  :root {
    --bg: #0b0d12; --card: #151821; --card2: #1d212d; --line: #2a2f3d;
    --text: #e9ecf2; --muted: #98a1b3; --gold: #f2c94c; --gold2: #fff1c1;
    --green: #4cd18a; --red: #ff7a6b; --accent: #7c8cff;
    --logo: "Cinzel", "Trajan Pro", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .logo { font: 800 26px var(--logo); letter-spacing: .08em; text-align: center; margin: 12px 0 2px;
          background: linear-gradient(180deg, var(--gold2), var(--gold) 55%, #b8890f); -webkit-background-clip: text;
          background-clip: text; color: transparent; }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .gold { color: var(--gold); } .pos { color: var(--green); }
  .big { font-size: 34px; font-weight: 800; color: var(--gold); margin: 4px 0 0; }
  button, a.btn { font: inherit; cursor: pointer; border: 0; border-radius: 10px; color: inherit; text-decoration: none; }
  .btn2 { background: var(--card2); border: 1px solid var(--line); padding: 6px 12px; font-size: 14px; }
  a.btn { display: block; text-align: center; padding: 14px; background: var(--accent); color: #fff; font-weight: 700; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tx { padding: 10px 0; border-top: 1px solid var(--line); }
  .tx:first-of-type { border-top: 0; }
  code { font: 13px Consolas, ui-monospace, monospace; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .chip.on { border-color: var(--accent); background: rgba(124, 140, 255, .18); }
  .me { border-color: var(--gold); background: rgba(242, 201, 76, .08); }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin: 24px 0 8px; }
</style>
</head>
<body>
<main>
  <div class="logo" translate="no">4rt3mi5</div>
  <div class="sub">Lootsplit compartilhado</div>

  <div id="loading" class="card muted">Carregando o lootsplit…</div>
  <div id="closed" class="card hidden"><b id="closedMsg"></b></div>

  <div id="view" class="hidden">
    <div class="card">
      <div class="muted" id="meta"></div>
      <div class="muted" style="margin-top:10px">Cada um fica com</div>
      <div class="big" id="each"></div>
      <div class="muted" id="perHour"></div>
    </div>

    <div class="card">
      <div class="muted">Quem é você nesta hunt? Toque no seu nome para ver só o que importa para você.</div>
      <div class="chips" id="who"></div>
      <div id="mine" class="hidden" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <b>💸 Quem transfere para quem</b>
      <div id="txs" style="margin-top:6px"></div>
      <div class="muted" id="paidSummary" style="margin-top:8px"></div>
    </div>

    <a class="btn" href="/">Fazer o meu lootsplit no 4rt3mi5</a>
  </div>

  <footer>4rt3mi5 · hunt companion</footer>
</main>
<script src="/split.js"></script>
</body>
</html>
